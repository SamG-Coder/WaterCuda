name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: main
          path: .native/emsdk
      - uses: actions/cache@v4
        with:
          path: |
            .native/emsdk/upstream
            .native/emsdk/node
            .native/emsdk/downloads
          key: emscripten-6.0.10-${{ runner.os }}
      - name: Build shared-memory CUDA WASM
        shell: bash
        run: |
          .native/emsdk/emsdk install 6.0.10
          .native/emsdk/emsdk activate 6.0.10
          source .native/emsdk/emsdk_env.sh
          npm run build:wasm
      - run: node tools/pages.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
