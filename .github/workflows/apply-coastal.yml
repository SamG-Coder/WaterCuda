name: Apply verified coastal implementation
# One-time transport of the locally tested source diff. Workflow changes are
# committed separately through the authorized repository connector, not this token.
on:
  push:
    branches: [feat/coastal-realism]
    paths: ['.coastal-patch-*.b64', '.github/workflows/apply-coastal.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'SamG-Coder/WaterCuda' && github.ref == 'refs/heads/feat/coastal-realism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify complete source diff before applying
        shell: bash
        run: |
          set -euo pipefail
          sed 's/Iempeses4M/Iempes4M/' .coastal-patch-1.b64 > "$RUNNER_TEMP/part1"
          test "$(git hash-object "$RUNNER_TEMP/part1")" = 1ac439227498bcd4c49645fe4193a9a4281a5cd2
          cat "$RUNNER_TEMP/part1" .coastal-patch-{2,3,4,5}.b64 | base64 --decode | gzip -d > "$RUNNER_TEMP/coastal.patch"
          echo "a89d6014f32b98a715777ca219326ea0091357612ae0b6c0b71dd45ad60b440a  $RUNNER_TEMP/coastal.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/coastal.patch"
          git apply "$RUNNER_TEMP/coastal.patch"
      - run: npm test
      - run: npm run test:native
      - name: Commit verified source to the feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git restore .github/workflows/coastal-validation.yml
          git rm .coastal-patch-{1,2,3,4,5}.b64
          git add -u
          git add src/sea-looks.js tests/coastal.test.mjs tests/compiler-contract.test.mjs tests/cpu-ocean.hpp tests/visual.cpp tools/coastal-browser-test.mjs docs/coastal-realism.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Improve coastal optics, FFT caustics and cached ocean evolution'
          git push origin HEAD:refs/heads/feat/coastal-realism
