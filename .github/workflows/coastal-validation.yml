name: Coastal rendering validation
on:
  push:
    branches: [feat/coastal-realism]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:native
      - name: Reproducible source snapshot
        if: always()
        run: git archive --format=tar HEAD | gzip > water-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coastal-validation-${{ github.sha }}
          path: |
            water-source.tar.gz
            reports/
          retention-days: 14
